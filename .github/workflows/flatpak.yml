name: Build and Release Flatpak

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  flatpak:
    name: "Build Flatpak Bundle"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Pinux.flatpak
          manifest-path: flatpak/io.github.gbu_project.Pinux.yml
          app-id: io.github.gbu_project.Pinux

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinux-flatpak-bundle
          path: Pinux.flatpak

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Pinux.flatpak
          generate_release_notes: true
